<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小红书移动端原型</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <button class="icon-btn" type="button" aria-label="扫一扫/更多">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 7V4h3" />
            <path d="M20 7V4h-3" />
            <path d="M4 17v3h3" />
            <path d="M20 17v3h-3" />
            <path d="M7 12h10" />
          </svg>
        </button>
        <div class="brand"><span id="pageTitle">首页</span><span class="dot">·</span> 原型</div>
        <button class="icon-btn" type="button" aria-label="设置">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>
            <path d="M19.4 15a7.9 7.9 0 0 0 .1-6l2-1.2-2-3.4-2.3.8a8.1 8.1 0 0 0-5.2-3L11.6 0h-4L7 2.2a8.1 8.1 0 0 0-5.2 3L-.5 4.4-2.5 7.8-.5 9a7.9 7.9 0 0 0 .1 6l-2 1.2 2 3.4 2.3-.8a8.1 8.1 0 0 0 5.2 3L7.6 24h4l.6-2.2a8.1 8.1 0 0 0 5.2-3l2.3.8 2-3.4-2-1.2Z" opacity=".25"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="content" style="padding: 0;">
      <iframe id="frame" class="frame" title="页面" src="pages/home.html"></iframe>
    </main>

    <nav class="tabbar" aria-label="底部导航">
      <div class="tabs">
        <a class="tab active" href="#home" data-route="home">
          <span class="dot"></span>
          <i class="bi bi-house"></i>
          <div>首页</div>
        </a>
        <a class="tab" href="#search" data-route="search">
          <span class="dot"></span>
          <i class="bi bi-compass"></i>
          <div>发现</div>
        </a>
        <a class="tab" href="#publish" data-route="publish">
          <span class="dot"></span>
          <i class="bi bi-plus-square"></i>
          <div>发布</div>
        </a>
        <a class="tab" href="#messages" data-route="messages">
          <span class="dot"></span>
          <i class="bi bi-chat-dots"></i>
          <div>消息</div>
        </a>
        <a class="tab" href="#profile" data-route="profile">
          <span class="dot"></span>
          <i class="bi bi-person"></i>
          <div>我的</div>
        </a>
      </div>
    </nav>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
