<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>笔记详情</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <div class="content">
    <div class="row" style="justify-content:space-between; margin: 4px 2px 10px;">
      <button class="btn" type="button" data-nav="home">← 返回</button>
      <span class="hint">原型：内容为占位</span>
    </div>

    <div class="hero"></div>

    <div class="detail-head">
      <div class="user">
        <div class="avatar" style="width:34px;height:34px;"></div>
        <div>
          <strong>小七的衣橱</strong>
          <small>2026-01-16 · 上海</small>
        </div>
      </div>
      <button class="btn primary" type="button" id="follow">关注</button>
    </div>

    <h2 style="margin: 8px 2px 0; font-size: 18px;">冬日氛围感通勤穿搭</h2>
    <div class="paragraph">
      低饱和配色 + 利落剪裁，通勤也能很有氛围。上衣选短款更显比例；大衣建议选直筒廓形。
      这条笔记用于原型演示：点赞/收藏/评论为模拟交互。
    </div>

    <div class="tags">
      <span class="tag">#穿搭</span>
      <span class="tag">#通勤</span>
      <span class="tag">#冬季</span>
      <span class="tag">#氛围感</span>
    </div>

    <div class="actions">
      <button class="action" type="button" id="like">❤ 点赞 <span class="hint" id="likeCount">128</span></button>
      <button class="action" type="button" id="fav">☆ 收藏</button>
      <button class="action" type="button" id="share">⤴ 分享</button>
    </div>

    <div class="section-title">热门评论</div>
    <div class="card" style="overflow:hidden;">
      <div class="comment">
        <div class="avatar"></div>
        <div>
          <strong style="font-size:13px;">早八人</strong>
          <p>配色太舒服了！想要大衣链接～</p>
          <div class="hint">2 小时前</div>
        </div>
      </div>
      <div class="comment">
        <div class="avatar"></div>
        <div>
          <strong style="font-size:13px;">奶油不加糖</strong>
          <p>同款思路我也在用，确实显高级。</p>
          <div class="hint">4 小时前</div>
        </div>
      </div>
      <div class="comment">
        <div class="avatar"></div>
        <div>
          <strong style="font-size:13px;">路过的橘子</strong>
          <p>短外套 + 高腰裤这个比例太绝了。</p>
          <div class="hint">昨天</div>
        </div>
      </div>
    </div>

    <div class="space"></div>

    <div class="card" style="padding:12px;">
      <div class="row" style="gap:8px;">
        <input class="search-input" id="c" placeholder="说点什么…" style="height:40px;" />
        <button class="btn primary" type="button" id="send">发送</button>
      </div>
      <div class="hint" style="margin-top:8px;">原型：发送后会弹提示</div>
    </div>
  </div>

  <script src="../assets/page-bridge.js"></script>
  <script>
    const follow = document.getElementById('follow');
    follow.addEventListener('click', ()=>{
      const isFollowing = follow.dataset.on === '1';
      follow.dataset.on = isFollowing ? '0' : '1';
      follow.textContent = isFollowing ? '关注' : '已关注';
      follow.classList.toggle('primary', isFollowing);
    });

    const likeBtn = document.getElementById('like');
    const likeCount = document.getElementById('likeCount');
    likeBtn.addEventListener('click', ()=>{
      const on = likeBtn.dataset.on === '1';
      likeBtn.dataset.on = on ? '0' : '1';
      const n = parseInt(likeCount.textContent, 10) || 0;
      likeCount.textContent = String(on ? Math.max(0, n-1) : n+1);
    });

    document.getElementById('fav').addEventListener('click', ()=> alert('原型：已收藏'));
    document.getElementById('share').addEventListener('click', ()=> alert('原型：已生成分享面板'));

    document.getElementById('send').addEventListener('click', ()=>{
      const v = (document.getElementById('c').value || '').trim();
      if(!v) return alert('写点评论再发');
      alert('原型：评论已发送');
      document.getElementById('c').value = '';
    });
  </script>
</body>
</html>
