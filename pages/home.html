<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>首页</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <div class="content">
    <div class="card" style="padding:12px;">
      <div class="row" style="justify-content:space-between;">
        <div class="row" style="gap:8px;">
          <button class="btn primary" type="button">关注</button>
          <button class="btn" type="button">推荐</button>
          <button class="btn" type="button">附近</button>
        </div>
        <span class="hint">点卡片进入详情</span>
      </div>
    </div>

    <div class="space"></div>

    <div class="feed">
      <a class="card note" href="#" data-nav="detail" aria-label="打开笔记详情">
        <div class="note-media"><div class="badge">穿搭</div></div>
        <div class="note-body">
          <h3 class="note-title">冬日氛围感通勤穿搭：低饱和更显高级</h3>
          <div class="note-meta">
            <div class="meta-left"><div class="avatar"></div><span>小七的衣橱</span></div>
            <div>❤ 1.2k</div>
          </div>
        </div>
      </a>

      <a class="card note" href="#" data-nav="detail" aria-label="打开笔记详情">
        <div class="note-media"><div class="badge">美食</div></div>
        <div class="note-body">
          <h3 class="note-title">5 分钟快手早餐：空气炸锅吐司做法</h3>
          <div class="note-meta">
            <div class="meta-left"><div class="avatar"></div><span>一口小面包</span></div>
            <div>❤ 860</div>
          </div>
        </div>
      </a>

      <a class="card note" href="#" data-nav="detail" aria-label="打开笔记详情">
        <div class="note-media"><div class="badge">旅行</div></div>
        <div class="note-body">
          <h3 class="note-title">周末 citywalk 路线：拍照点位都标好了</h3>
          <div class="note-meta">
            <div class="meta-left"><div class="avatar"></div><span>路过的橘子</span></div>
            <div>❤ 2.4k</div>
          </div>
        </div>
      </a>

      <a class="card note" href="#" data-nav="detail" aria-label="打开笔记详情">
        <div class="note-media"><div class="badge">护肤</div></div>
        <div class="note-body">
          <h3 class="note-title">敏感肌冬季修护：精简但有效的流程</h3>
          <div class="note-meta">
            <div class="meta-left"><div class="avatar"></div><span>皮肤研究所</span></div>
            <div>❤ 3.1k</div>
          </div>
        </div>
      </a>

      <a class="card note" href="#" data-nav="detail" aria-label="打开笔记详情">
        <div class="note-media"><div class="badge">学习</div></div>
        <div class="note-body">
          <h3 class="note-title">从 0 到 1 做作品集：我用这 4 步梳理</h3>
          <div class="note-meta">
            <div class="meta-left"><div class="avatar"></div><span>被迫努力</span></div>
            <div>❤ 420</div>
          </div>
        </div>
      </a>

      <a class="card note" href="#" data-nav="detail" aria-label="打开笔记详情">
        <div class="note-media"><div class="badge">家居</div></div>
        <div class="note-body">
          <h3 class="note-title">租房改造：500 元把卧室变成奶油风</h3>
          <div class="note-meta">
            <div class="meta-left"><div class="avatar"></div><span>奶油不加糖</span></div>
            <div>❤ 980</div>
          </div>
        </div>
      </a>
    </div>
  </div>

  <script src="../assets/page-bridge.js"></script>
