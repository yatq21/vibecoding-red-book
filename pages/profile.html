<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>我的</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <div class="content">
    <div id="loggedOutView" class="card" style="padding:14px; display:none;">
      <div class="row" style="justify-content:space-between;">
        <div>
          <strong style="font-size:16px;">未登录</strong>
          <div class="hint" style="margin-top:4px;">原型：点击登录以继续浏览个人中心</div>
        </div>
        <button class="btn primary" type="button" id="login">登录</button>
      </div>
    </div>

    <div id="loggedInView" class="card profile-head">
      <div class="profile-row">
        <div class="profile-avatar"></div>
        <div style="min-width:0;">
          <div class="row" style="justify-content:space-between;">
            <strong style="font-size:16px;">你的小红书号</strong>
            <button class="btn" type="button" id="edit">编辑资料</button>
          </div>
          <div class="hint" style="margin-top:4px;">简介：用原型快速对齐需求</div>
          <div class="stats">
            <div class="stat"><strong>128</strong>关注</div>
            <div class="stat"><strong>2,046</strong>粉丝</div>
            <div class="stat"><strong>86</strong>获赞与收藏</div>
          </div>
        </div>
      </div>
    </div>

    <div id="memberArea">
      <div class="space"></div>

      <div class="card" style="padding:12px;">
        <div class="row" style="justify-content:space-between;">
          <strong>我的笔记</strong>
          <span class="hint">草稿 2</span>
        </div>
      </div>

      <div class="space"></div>

      <div class="feed">
        <a class="card note" href="#" data-nav="detail">
          <div class="note-media"><div class="badge">我发布的</div></div>
          <div class="note-body">
            <h3 class="note-title">租房改造：500 元奶油风卧室</h3>
            <div class="note-meta">
              <div class="meta-left"><div class="avatar"></div><span>我</span></div>
              <div>❤ 320</div>
            </div>
          </div>
        </a>
        <a class="card note" href="#" data-nav="detail">
          <div class="note-media"><div class="badge">我发布的</div></div>
          <div class="note-body">
            <h3 class="note-title">5 分钟早餐：空气炸锅吐司</h3>
            <div class="note-meta">
              <div class="meta-left"><div class="avatar"></div><span>我</span></div>
              <div>❤ 210</div>
            </div>
          </div>
        </a>
      </div>

      <div class="space"></div>

      <div class="card list">
        <div class="list-item">
          <div class="thumb"></div>
          <div class="text">
            <strong>收藏</strong>
            <small>你喜欢的内容都在这</small>
          </div>
        </div>
        <div class="list-item">
          <div class="thumb"></div>
          <div class="text">
            <strong>设置</strong>
            <small>隐私 / 通知 / 账号安全</small>
          </div>
        </div>
        <a class="list-item" href="#" id="logout">
          <div class="thumb"></div>
          <div class="text">
            <strong style="color: var(--brand);">退出登录</strong>
            <small>清除本机登录状态（原型）</small>
          </div>
        </a>
      </div>
    </div>
  </div>

  <script src="../assets/page-bridge.js"></script>
  <script>
    const STORAGE_KEY = 'rb_logged_in';
    function isLoggedIn(){
      // 默认视为已登录，方便原型演示
      const v = localStorage.getItem(STORAGE_KEY);
      return v !== '0';
    }
    function setLoggedIn(on){
      localStorage.setItem(STORAGE_KEY, on ? '1' : '0');
    }
    function render(){
      const on = isLoggedIn();
      document.getElementById('loggedInView').style.display = on ? '' : 'none';
      document.getElementById('memberArea').style.display = on ? '' : 'none';
      document.getElementById('loggedOutView').style.display = on ? 'none' : '';
    }

    document.getElementById('edit')?.addEventListener('click', ()=> alert('原型：编辑资料'));
    document.getElementById('login')?.addEventListener('click', ()=>{
      setLoggedIn(true);
      alert('原型：登录成功');
      render();
    });
    document.getElementById('logout')?.addEventListener('click', (e)=>{
      e.preventDefault();
      if(!confirm('确认退出登录？')) return;

      // 原型：仅清理登录标记 + 常见缓存
      setLoggedIn(false);
      try { sessionStorage.clear(); } catch {}
      alert('已退出登录');
      render();
      window.RedBookProto?.nav('home');
    });

    render();
  </script>
</body>
</html>
